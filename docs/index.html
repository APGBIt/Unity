* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--fondo); color: var(--texto); font: 17px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; }

.btn.rojo { color: var(--peligro-suave); }

.btn.icono { flex: 0 0 56px; padding: 0; font-size: 22px; }
.btn.alto { min-height: 72px; }
.btn.grande { min-height: 84px; font-size: 22px; text-align: left; padding: 16px 20px; flex: 0 0 auto; }

.dato { color: var(--secundario); font-size: 15.5px; }
.pestanas { display: flex; gap: 8px; }

.volver { width: 44px; height: 44px; border: 0; border-radius: 12px; background: var(--clara); color: var(--texto); font-size: 28px; line-height: 1; cursor: pointer; flex: 0 0 auto; }
.pagina { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.lista { display: flex; flex-direction: column; gap: 8px; }
.renglon { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; text-align: left; min-height: 56px; padding: 12px 16px; border-radius: var(--radio); border: 1px solid var(--borde); background: var(--superficie); cursor: pointer; }
.avance { font-size: 14px; color: var(--secundario); white-space: nowrap; }
.avance.empezada { color: var(--advertencia); }
.avance.lista { color: var(--exito); font-weight: 700; }
.marca-clip { color: var(--acento); }
.aviso { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); max-width: min(92vw, 560px); background: #F2F5F9; color: #0B1220; padding: 12px 16px; border-radius: 12px; font-weight: 600; font-size: 15.5px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 50; text-align: center; }
.aviso.visible { opacity: 1; transform: translate(-50%, 0); }

.velo { position: fixed; inset: 0; z-index: 40; background: rgba(3, 7, 14, .78); display: flex; align-items: flex-end; justify-content: center; padding: 12px; }
.caja { width: 100%; max-width: 560px; background: var(--superficie); border: 1px solid var(--borde); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 14px; max-height: 88dvh; overflow: auto; }
.caja.alta { height: 82dvh; }
.caja.alta .lista { flex: 1 1 auto; overflow: auto; }
.caja h2 { font-size: 20px; }
.caja p { color: var(--secundario); }
.inicio { padding: 20px 16px 24px; display: flex; flex-direction: column; gap: 14px; }
.marca { display: flex; align-items: center; gap: 14px; margin: 6px 0 4px; }
.logo { width: 60px; height: 60px; border-radius: 18px; background: var(--acento-oscuro); display: grid; place-items: center; font-size: 32px; }
.marca h1 { font-size: 30px; letter-spacing: -.01em; }
.marca p { color: var(--secundario); font-size: 15.5px; }
.tarjeta.estado { display: flex; flex-direction: column; gap: 2px; border-left: 4px solid var(--exito); }
.tarjeta.estado.vacia { border-left-color: var(--advertencia); }
.tarjeta.estado span { color: var(--secundario); font-size: 15px; }
.tarjeta.fila-entre p { font-size: 15px; color: var(--secundario); }
.camara { position: relative; background: #000; overflow: hidden; flex: 0 0 auto; height: 40dvh; min-height: 220px; }
.camara video { width: 100%; height: 100%; object-fit: cover; display: block; }
.camara video.espejo { transform: scaleX(-1); }
.camara .esqueleto { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.chip-camara { position: absolute; left: 10px; top: 10px; padding: 6px 12px; border-radius: 999px; background: rgba(11, 18, 32, .82); font-size: 14px; font-weight: 650; }
.chip-camara.activo { background: var(--acento); color: var(--sobre-acento); }
.chip-camara.alerta { background: var(--advertencia); color: #201503; }
.girar { position: absolute; right: 10px; top: 10px; width: 44px; height: 44px; border-radius: 50%; border: 0; background: rgba(11, 18, 32, .82); color: #fff; font-size: 22px; cursor: pointer; }
.estado-camara { position: absolute; inset: auto 0 0 0; padding: 10px 14px; background: rgba(11, 18, 32, .88); font-size: 15px; display: none; }
.estado-camara.visible { display: block; }
.estado-camara.error { color: var(--advertencia); inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; }
.conversacion, .ensenar-sena { display: flex; flex-direction: column; flex: 1 1 auto; }
.panel-sordo, .panel-oyente { padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; }

.chip.abierta { background: var(--acento-oscuro); border-color: var(--acento); color: #fff; }

.chip.paso.sin-clip { border-style: dashed; color: var(--secundario); }
.chip.paso.actual { background: var(--acento); border-color: var(--acento); color: var(--sobre-acento); }

.opciones span { color: var(--secundario); font-size: 14.5px; }
.nota-frase { color: var(--secundario); font-size: 14px; }

.aviso-fijo { border-left: 4px solid var(--advertencia); }

.tarjeta-palabra { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 20px; font-size: 44px; font-weight: 800; overflow-wrap: anywhere; background: var(--superficie); }
.rotulo-avatar { text-align: center; font-size: 20px; font-weight: 700; color: var(--acento); min-height: 28px; }
.intro { color: var(--secundario); }
.contador { display: flex; align-items: baseline; gap: 10px; }

.contador.lista strong { color: var(--exito); }
.contador span { color: var(--secundario); font-size: 15px; }
.estado-grabacion { font-size: 17px; min-height: 48px; }

.resultado-prueba:empty { display: none; }
.resultado-prueba.bien { color: var(--exito); }
.resultado-prueba.mal { color: var(--advertencia); }

.lista-emergencia { display: flex; flex-direction: column; gap: 10px; }
